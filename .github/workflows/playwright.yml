name: Playwright Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Nightly at 11:17 UTC (6:17 am CDT, 5:17 am CST). Catches drift in Sauce Demo and the OpenWeather API.
        # Cron ignores daylight saving, so this time sits mid-morning in both seasons. The odd minute avoids
        # GitHub's busiest moment, the top of the hour, when scheduled runs are most often delayed.
        - cron: '17 11 * * *'
    workflow_dispatch:

permissions:
    contents: read

# A newer push to a PR cancels the older run. Pushes to main and nightly runs always finish.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    # Sauce Demo's public demo credentials. These are not secrets.
    BASE_URL: https://www.saucedemo.com
    STANDARD_USER: standard_user
    PASSWORD: secret_sauce

# Pinned instead of ubuntu-latest, which moves to Ubuntu 26 on 2026-10-19. Move to a newer image on
# purpose, after checking that Playwright supports it, so the nightly run does not break by surprise.
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck

    ui:
        name: UI tests
        needs: lint
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            # Not `npm test`: its pretest step clears allure-results, which CI does not need.
            - name: Run UI tests
              run: npx playwright test --project=chromium
            - name: Upload Allure results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: allure-results-ui
                  path: allure-results
                  retention-days: 14
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-ui
                  path: playwright-report
                  retention-days: 14
            - name: Upload traces and screenshots
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: test-results-ui
                  path: test-results
                  retention-days: 14

    api:
        name: API tests
        needs: lint
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # Without the key every API test skips and the job would still pass. Fail loudly instead.
            # Fork PRs never receive secrets, so they are exempt. Dependabot PRs read Dependabot secrets,
            # not Actions secrets, so the key must also be added under Settings > Secrets > Dependabot.
            - name: Require the API key
              if: ${{ github.event.pull_request.head.repo.fork != true }}
              env:
                  OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
              run: |
                  if [ -z "$OPENWEATHER_API_KEY" ]; then
                    echo "::error::OPENWEATHER_API_KEY is not available to this run"
                    exit 1
                  fi
            # The key is set on this step only, so no other step (npm ci, for example) can read it.
            - name: Run API tests
              env:
                  OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
              run: npx playwright test --project=api
            - name: Upload Allure results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: allure-results-api
                  path: allure-results
                  retention-days: 14
            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report-api
                  path: playwright-report
                  retention-days: 14
            - name: Upload test results
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: test-results-api
                  path: test-results
                  retention-days: 14

    # Builds the Allure report and the landing page. Read-only: it runs `npm ci`, so it gets no write access.
    report:
        name: Report
        needs: [lint, ui, api]
        # Runs after failed test jobs too, so a red run still produces a report. Cancelled runs are skipped.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Download Allure results
              uses: actions/download-artifact@v8
              continue-on-error: true
              with:
                  pattern: allure-results-*
                  path: allure-results
                  merge-multiple: true
            # The last published site holds the history file behind Allure's trend charts.
            # Before the first publish there is no gh-pages branch, so this step is allowed to fail.
            - name: Fetch the published site
              uses: actions/checkout@v7
              continue-on-error: true
              with:
                  ref: gh-pages
                  path: published
                  persist-credentials: false
            - name: Carry history forward
              run: |
                  mkdir -p allure-history
                  if [ -f published/history/history.jsonl ]; then
                    cp published/history/history.jsonl allure-history/history.jsonl
                  fi
            # allurerc.mjs appends this run to the history file as it generates.
            - name: Generate the Allure report
              if: ${{ hashFiles('allure-results/**') != '' }}
              run: npx allure generate allure-results --clean
            - name: Build the site
              env:
                  LINT_RESULT: ${{ needs.lint.result }}
                  UI_RESULT: ${{ needs.ui.result }}
                  API_RESULT: ${{ needs.api.result }}
              run: |
                  mkdir -p publish/history
                  cp -r site/. publish/
                  if [ -d allure-report ]; then cp -r allure-report publish/report; fi
                  if [ -f allure-history/history.jsonl ]; then cp allure-history/history.jsonl publish/history/history.jsonl; fi
                  node scripts/buildStatus.mts publish/status.json
            - name: Upload the site
              uses: actions/upload-artifact@v7
              with:
                  name: site
                  path: publish
                  retention-days: 14

    # Pushes the built site to the gh-pages branch. The only job with write access, and it runs no project code.
    publish:
        name: Publish to GitHub Pages
        needs: report
        # Only main and the nightly schedule publish. Pull requests and manual runs on other branches just build.
        if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        # Serializes publishing so a push and the nightly run can never write gh-pages at the same time.
        concurrency:
            group: pages-publish
            cancel-in-progress: false
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: site
                  path: publish
            # keep_files leaves earlier files in place and overwrites the ones that changed.
            - uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./publish
                  keep_files: true
