<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Playwright + TypeScript: Latest Results</title>
		<meta name="description" content="Latest CI results for a Playwright and TypeScript test automation project." />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<header>
				<p class="eyebrow">Playwright + TypeScript</p>
				<h1>Latest test results</h1>
				<p class="lede">
					Sauce Demo UI tests and OpenWeather API tests, run by GitHub Actions on every push to main and
					nightly.
				</p>
			</header>

			<section class="card" id="status-card" aria-live="polite">
				<p id="status-chip" class="chip chip-unknown">Loading…</p>
				<p id="status-detail" class="detail"></p>

				<ul id="layers" class="layers" hidden></ul>

				<dl id="facts" class="facts" hidden>
					<div>
						<dt>Tests</dt>
						<dd id="fact-tests"></dd>
					</div>
					<div>
						<dt>Run</dt>
						<dd id="fact-date"></dd>
					</div>
					<div>
						<dt>Trigger</dt>
						<dd id="fact-trigger"></dd>
					</div>
					<div>
						<dt>Commit</dt>
						<dd><a id="fact-commit" rel="noopener"></a></dd>
					</div>
				</dl>

				<div class="actions">
					<a class="button primary" id="link-report" href="report/">Open the full Allure report</a>
					<a class="button" id="link-run" rel="noopener" hidden>View the CI run</a>
					<span class="button disabled" aria-disabled="true">Test health: coming soon</span>
				</div>
			</section>

			<footer>
				<a href="https://github.com/yeshallbeasgods/universal-cloudless-thousandoaks" rel="noopener"
					>Source on GitHub</a
				>
			</footer>
		</main>
		<script src="app.js"></script>
	</body>
</html>
